<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://i.ibb.co/TBzgsbMS/TS-logo-with-vibrant-gradients.jpg" type="image/jpeg">
  <title>Store Admin - Tech Source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    :root{--bg:#eef3f8;--card:#fff;--text:#102033;--muted:#63758c;--line:#d8e1ec;--brand:#155dfc;--danger:#dc2626;--ok:#059669;--shadow:0 18px 48px rgba(16,32,51,.12)}
    *{box-sizing:border-box}
    body{display:none;margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea{font:inherit}
    .topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
    .topbar-inner{max-width:1120px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:1.1rem;font-weight:800}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
    .btn.primary{background:var(--brand);color:#fff}
    .btn.secondary{background:#edf3fb;color:var(--text);border:1px solid var(--line)}
    .btn.danger{background:#fee2e2;color:var(--danger)}
    main{max-width:1120px;margin:auto;padding:22px 18px;display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
    .panel h2{margin:0 0 4px;font-size:1.25rem}
    .panel p{margin:0 0 16px;color:var(--muted);line-height:1.5}
    label{display:block;font-weight:800;font-size:.86rem;margin:12px 0 6px}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fbfdff;color:var(--text);outline:none}
    input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,93,252,.12)}
    textarea{min-height:92px;resize:vertical}
    .preview{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:14px;background:#f8fbff}
    .preview img{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#e8eef7}
    .status{margin-top:12px;color:var(--muted);font-weight:700;font-size:.9rem;min-height:22px}
    .status.ok{color:var(--ok)}.status.err{color:var(--danger)}
    .list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .list-head h2{margin:0}
    .app-list{display:grid;gap:12px}
    .app-row{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .app-row img{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#eef3fa}
    .app-row h3{margin:0;font-size:1rem}
    .app-row p{margin:4px 0 0;color:var(--muted);font-size:.86rem;word-break:break-word}
    .row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
    @media(max-width:820px){main{grid-template-columns:1fr}.topbar-inner{align-items:flex-start;flex-direction:column}.app-row{grid-template-columns:52px 1fr}.row-actions{grid-column:1/-1;justify-content:stretch}.row-actions .btn{flex:1;justify-content:center}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand">Tech Source Store Admin</div>
        <small id="adminEmail">Checking admin...</small>
      </div>
      <div class="actions">
        <button class="btn secondary" type="button" onclick="window.open('appstore.html')"><i class="fa-solid fa-store"></i> Open Store</button>
        <button class="btn danger" type="button" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">Add App</h2>
      <p>App name, logo and download link yahan se public app store me show hoga.</p>

      <form id="appForm">
        <input type="hidden" id="editId">

        <label for="appName">App Name</label>
        <input id="appName" type="text" placeholder="Example: Tech Source APK" required>

        <label for="downloadUrl">Download Link</label>
        <input id="downloadUrl" type="url" placeholder="https://github.com/.../app.apk" required>

        <label for="appVersion">Version Text</label>
        <input id="appVersion" type="text" placeholder="Latest APK / v1.0">

        <label for="appDescription">Short Description</label>
        <textarea id="appDescription" placeholder="Official Android app download."></textarea>

        <label for="logoFile">Logo Upload</label>
        <input id="logoFile" type="file" accept="image/*">

        <label for="logoUrl">Logo Link</label>
        <input id="logoUrl" type="url" placeholder="Upload logo or paste image link">

        <div class="preview">
          <img id="logoPreview" src="https://i.ibb.co/TBzgsbMS/TS-logo-with-vibrant-gradients.jpg" alt="Logo preview">
          <div>
            <strong>Logo Preview</strong>
            <p style="margin:4px 0 0;color:var(--muted);font-size:.86rem">Upload karne par link auto set ho jayega.</p>
          </div>
        </div>

        <button class="btn primary" id="saveBtn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save App</button>
        <button class="btn secondary" type="button" onclick="resetForm()"><i class="fa-solid fa-rotate-left"></i> Clear</button>
        <div class="status" id="statusText"></div>
      </form>
    </section>

    <section class="panel">
      <div class="list-head">
        <div>
          <h2>Apps List</h2>
          <p id="listCount">Loading...</p>
        </div>
      </div>
      <div class="app-list" id="appList">
        <div class="empty">Loading apps...</div>
      </div>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDZ-NvSzXJrH8YyvI5GWVWRtZnSNe0NAxU",
      authDomain: "tech-source-bill.firebaseapp.com",
      databaseURL: "https://tech-source-bill-default-rtdb.firebaseio.com",
      projectId: "tech-source-bill",
      storageBucket: "tech-source-bill.firebasestorage.app",
      messagingSenderId: "690209240188",
      appId: "1:690209240188:web:6e54de365e7f839634c5f9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "techsource@gmail.com";
    const IMGBB_API_KEY = "fa4ad05090c8cc3f9ade673a64a52235";

    const form = document.getElementById("appForm");
    const editId = document.getElementById("editId");
    const appName = document.getElementById("appName");
    const downloadUrl = document.getElementById("downloadUrl");
    const appVersion = document.getElementById("appVersion");
    const appDescription = document.getElementById("appDescription");
    const logoFile = document.getElementById("logoFile");
    const logoUrl = document.getElementById("logoUrl");
    const logoPreview = document.getElementById("logoPreview");
    const saveBtn = document.getElementById("saveBtn");
    const statusText = document.getElementById("statusText");
    const appList = document.getElementById("appList");
    const listCount = document.getElementById("listCount");
    const formTitle = document.getElementById("formTitle");

    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      if (user.email !== ADMIN_EMAIL) {
        auth.signOut().then(() => window.location.replace("login.html"));
        return;
      }
      document.body.style.display = "block";
      document.getElementById("adminEmail").textContent = user.email;
      loadApps();
    });

    function htmlSafe(value) {
      const div = document.createElement("div");
      div.textContent = value || "";
      return div.innerHTML;
    }

    function setStatus(message, type) {
      statusText.textContent = message || "";
      statusText.className = `status ${type || ""}`;
    }

    function setSaving(isSaving) {
      saveBtn.disabled = isSaving;
      saveBtn.innerHTML = isSaving ? `<i class="fa-solid fa-spinner fa-spin"></i> Saving...` : `<i class="fa-solid fa-floppy-disk"></i> Save App`;
    }

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append("image", file);
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
      const data = await res.json();
      if (!data.success || !data.data?.url) throw new Error("Logo upload failed");
      return data.data.url;
    }

    logoFile.addEventListener("change", () => {
      const file = logoFile.files[0];
      if (file) logoPreview.src = URL.createObjectURL(file);
    });

    logoUrl.addEventListener("input", () => {
      if (logoUrl.value.trim()) logoPreview.src = logoUrl.value.trim();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setSaving(true);
      setStatus("Saving app...", "");

      try {
        let finalLogoUrl = logoUrl.value.trim();
        const file = logoFile.files[0];
        if (file) {
          setStatus("Uploading logo...", "");
          finalLogoUrl = await uploadToImgBB(file);
          logoUrl.value = finalLogoUrl;
        }

        if (!finalLogoUrl) throw new Error("Logo upload karo ya logo link paste karo");

        const payload = {
          name: appName.value.trim(),
          downloadUrl: downloadUrl.value.trim(),
          version: appVersion.value.trim(),
          description: appDescription.value.trim(),
          logoUrl: finalLogoUrl,
          active: true,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (editId.value) {
          await db.collection("appStoreApps").doc(editId.value).update(payload);
          setStatus("App updated successfully", "ok");
        } else {
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection("appStoreApps").add(payload);
          setStatus("App added successfully", "ok");
        }

        resetForm(false);
      } catch (error) {
        setStatus(error.message || "Save failed", "err");
      } finally {
        setSaving(false);
      }
    });

    function resetForm(clearStatus = true) {
      form.reset();
      editId.value = "";
      formTitle.textContent = "Add App";
      logoPreview.src = "https://i.ibb.co/TBzgsbMS/TS-logo-with-vibrant-gradients.jpg";
      if (clearStatus) setStatus("", "");
    }

    function editApp(id, app) {
      editId.value = id;
      appName.value = app.name || "";
      downloadUrl.value = app.downloadUrl || "";
      appVersion.value = app.version || "";
      appDescription.value = app.description || "";
      logoUrl.value = app.logoUrl || "";
      logoPreview.src = app.logoUrl || "https://i.ibb.co/TBzgsbMS/TS-logo-with-vibrant-gradients.jpg";
      formTitle.textContent = "Edit App";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteApp(id) {
      if (!confirm("Delete this app from store?")) return;
      await db.collection("appStoreApps").doc(id).delete();
    }

    async function toggleApp(id, active) {
      await db.collection("appStoreApps").doc(id).update({
        active: !active,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function loadApps() {
      db.collection("appStoreApps").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const apps = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        listCount.textContent = apps.length ? `${apps.length} apps added` : "No apps added";

        if (!apps.length) {
          appList.innerHTML = `<div class="empty">No apps added yet.</div>`;
          return;
        }

        appList.innerHTML = apps.map((app) => `
          <div class="app-row">
            <img src="${htmlSafe(app.logoUrl)}" alt="${htmlSafe(app.name)}" onerror="this.src='https://i.ibb.co/TBzgsbMS/TS-logo-with-vibrant-gradients.jpg'">
            <div>
              <h3>${htmlSafe(app.name)}</h3>
              <p>${htmlSafe(app.downloadUrl)}</p>
              <p>Status: ${app.active === false ? "Hidden" : "Live"}</p>
            </div>
            <div class="row-actions">
              <button class="btn secondary" type="button" onclick='editApp("${app.id}", ${JSON.stringify(app).replace(/'/g, "&apos;")})'><i class="fa-solid fa-pen"></i> Edit</button>
              <button class="btn secondary" type="button" onclick='toggleApp("${app.id}", ${app.active !== false})'><i class="fa-solid fa-eye"></i> ${app.active === false ? "Show" : "Hide"}</button>
              <button class="btn danger" type="button" onclick='deleteApp("${app.id}")'><i class="fa-solid fa-trash"></i> Delete</button>
            </div>
          </div>
        `).join("");
      }, () => {
        appList.innerHTML = `<div class="empty">Apps load nahi ho raha. Firebase rules/check karo.</div>`;
      });
    }

    function logout() {
      auth.signOut().then(() => window.location.replace("login.html"));
    }
  </script>
</body>
</html>
