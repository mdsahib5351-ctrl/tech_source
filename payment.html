 const active=currentAttempt(l);if(active&&['verification_pending','customer_marked_paid','submitted'].includes(String(active.status||'').toLowerCase())){return toast('Active payment request hai. Pehle request verify/reject karein, phir amount/details edit karein')}

   await db.collection('customerPaymentRequests').doc(id).update(patch);

 }catch(e){toast(e.message||'Update failed')}finally{btn.disabled=false;if($('#eSave'))$('#eSave').innerHTML='Save Changes'}

async function verifyAttempt(id,ok){
 const a=attempts.find(x=>x.id===id);if(!a)return;
 if(!confirm(ok?'Accept this payment request?':'Reject this payment request?'))return;
 try{
  const link=a.linkId?links.find(x=>x.id===a.linkId):null;
  if(ok){
   const expected=Number(link?.amount||a.amount||0),submitted=Number(a.amount||0),mismatch=expected!==submitted;
   if(mismatch&&!confirm(`Amount mismatch!
Link amount: ₹${expected}
Request amount: ₹${submitted}

Accept anyway?`))return;
   await db.collection('paymentAttempts').doc(id).update({status:'paid',paymentStatus:'paid',verifiedAt:FS.serverTimestamp(),verifiedBy:admin.email,amountVerified:submitted,amountMismatch:mismatch});
   if(a.applicationId)await db.collection('applications').doc(a.applicationId).update({paymentStatus:'paid',paymentUtr:a.utr||'',paymentRequestId:id,paymentVerifiedAt:FS.serverTimestamp(),paymentVerifiedBy:admin.email,paymentAmountVerified:submitted}).catch(()=>{});
   if(a.linkId)await db.collection('customerPaymentRequests').doc(a.linkId).update({status:'paid',paymentStatus:'paid',currentAttemptId:id,paidAt:FS.serverTimestamp()}).catch(()=>{});
   toast(mismatch?'Payment accepted with amount mismatch':'Payment verified');
  }else{
   await db.collection('paymentAttempts').doc(id).update({status:'rejected',paymentStatus:'rejected',rejectedAt:FS.serverTimestamp(),rejectedBy:admin.email});
   if(a.linkId)await db.collection('customerPaymentRequests').doc(a.linkId).update({status:'pending',paymentStatus:'pending',currentAttemptId:null,lastRejectedAttemptId:id,reopenedAt:FS.serverTimestamp()}).catch(()=>{});
   toast('Payment rejected — link active again');
  }
  await loadData(true);
 }catch(e){toast(e.message||String(e))}
}

 if(existing){closeMediaZoom();return;}
 const canvas=q.querySelector('canvas');
 const img=q.querySelector('img');
 const src=canvas?canvas.toDataURL('image/png'):(img?img.src:'');
 if(!src)return;
 const overlay=document.createElement('div');
 overlay.id='mediaLightbox';
 overlay.className='media-lightbox';
 overlay.innerHTML=`<div class="media-lightbox-card qr-lightbox-card" role="dialog" aria-label="Zoomed payment QR">
   <div class="qr-lightbox-title"><span class="line"></span><span>Scan &amp; Pay with any UPI App</span><span class="line"></span></div>
   <div class="zoom-qr-wrap"><img class="zoom-qr-image" src="${src}" alt="Payment QR"></div>
   <div class="media-lightbox-hint">Tap anywhere to close</div>
 </div>`;
 document.body.appendChild(overlay);
 document.body.classList.add('qr-viewing');
 const card=overlay.querySelector('.media-lightbox-card');
 requestAnimationFrame(()=>overlay.classList.add('is-open'));
 overlay.addEventListener('click',closeMediaZoom);
}
function openCustomerPhoto(el){
 const src=el?.dataset?.photo;
 if(!src)return;
 const existing=document.getElementById('mediaLightbox');
 if(existing)closeMediaZoom();
 const name=el.dataset.name||'Customer';
 const phone=el.dataset.phone||'—';
 const ack=el.dataset.ack||'—';
 const type=el.dataset.type||'PAN Service';
 const overlay=document.createElement('div');
 overlay.id='mediaLightbox';
 overlay.className='media-lightbox';
 overlay.innerHTML=`<div class="media-lightbox-card customer-photo-card" role="dialog" aria-label="Customer details">
   <div class="customer-photo-large-wrap"><img class="customer-photo-large" src="${esc(src)}" alt="Customer photo"></div>
   <div class="photo-detail-head"><strong>${esc(name)}</strong><span>Customer Details</span></div>
   <div class="photo-details-grid">
    <div><span>NAME</span><b>${esc(name)}</b></div>
    <div><span>MOBILE</span><b>${esc(phone)}</b></div>
    <div><span>ACK / ID</span><b>${esc(ack)}</b></div>
    <div><span>APPLICATION</span><b>${esc(type)}</b></div>
   </div>
   <div class="media-lightbox-hint">Tap anywhere to close</div>
 </div>`;
 document.body.appendChild(overlay);
 document.body.classList.add('qr-viewing');
 const card=overlay.querySelector('.media-lightbox-card');
 requestAnimationFrame(()=>overlay.classList.add('is-open'));
 overlay.addEventListener('click',closeMediaZoom);
}
function closeMediaZoom(){
 const overlay=document.getElementById('mediaLightbox');
 if(!overlay)return;
 overlay.classList.remove('is-open');
 document.body.classList.remove('qr-viewing');
 setTimeout(()=>overlay.remove(),280);
}
function closeQRZoom(){closeMediaZoom()}

function startPayCountdown(d){clearInterval(window._paycd);if(!d.expiresAt){$('#expiryLine').textContent='';return}const tick=()=>{const s=Math.max(0,Math.floor((new Date(d.expiresAt).getTime()-Date.now())/1000));$('#expiryLine').innerHTML=s>0?`Link expires in <span class="countdown">${s}</span> seconds`:'<span style="color:#dc2626;font-weight:800">Payment link expired</span>';if(s<=0){clearInterval(window._paycd);$('#donePay').disabled=true}};tick();window._paycd=setInterval(tick,1000)}
function showPaymentSubmittingLoader(){
 const zone=document.getElementById('payQrZone');
 if(zone){
  zone.innerHTML='<div class="payment-submit-loader"><div class="submit-ring"><span></span><span></span><span></span><span></span></div><strong>Submitting Payment Request</strong><small>Please wait, your request is being securely sent…</small></div>';
 }
 const btn=document.getElementById('donePay');
 if(btn){btn.classList.add('is-submitting');btn.textContent='PAYMENT REQUEST SUBMITTING…';}
}

async function submitPayment(){
 if(!payCtx)return;const btn=$('#donePay'),utr=$('#payUtr')?.value.trim()||'';if(payCtx.utrMode==='required'&&!utr)return toast('UTR required hai');
 btn.disabled=true;showPaymentSubmittingLoader();
 try{
  const linkRef=db.collection('customerPaymentRequests').doc(payCtx.id),ref=db.collection('paymentAttempts').doc();
  const requestId='REQ-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const data={linkId:payCtx.id,requestId,applicationId:payCtx.applicationId||'',ackNo:payCtx.ackNo||'',name:payCtx.name||'',phone:payCtx.phone||'',email:payCtx.email||'',photo:payCtx.photo||'',applicationType:payCtx.applicationType||'PAN Service',amount:Number(payCtx.amount||0),utr,utrRequired:payCtx.utrMode==='required',status:'verification_pending',paymentStatus:'verification_pending',createdAt:FS.serverTimestamp(),customerSubmittedAt:FS.serverTimestamp()};
  await db.runTransaction(async tx=>{const snap=await tx.get(linkRef);if(!snap.exists)throw new Error('Payment link not found');const l=snap.data()||{};const st=String(l.status||'pending').toLowerCase();if(l.expiresAt&&new Date(l.expiresAt).getTime()<=Date.now()){tx.update(linkRef,{status:'expired',paymentStatus:'expired'});throw new Error('Payment link expired.');}if(['verification_pending','customer_marked_paid'].includes(st))throw new Error('Payment request already submitted. Please wait for verification.');if(st==='paid')throw new Error('Payment already completed.');tx.set(ref,data);tx.update(linkRef,{currentAttemptId:ref.id,status:'verification_pending',paymentStatus:'verification_pending',lastSubmittedAt:FS.serverTimestamp()});});
  if(payCtx.applicationId)await db.collection('applications').doc(payCtx.applicationId).update({paymentStatus:'verification_pending',paymentUtr:utr,paymentRequestId:ref.id,paymentSubmittedAt:FS.serverTimestamp(),paymentAmountSubmitted:Number(payCtx.amount||0)}).catch(()=>{});
  payCtx.currentAttemptId=ref.id;payCtx.status='verification_pending';payCtx.paymentStatus='verification_pending';startCustomerRealtime(payCtx.id);successScreen(data,'Your payment request has been sent successfully.');
 }catch(e){btn.disabled=false;renderPay(payCtx);toast(e.message||'Request failed')}
}
function successScreen(a,msg){clearInterval(window._paycd);const photo=String(a.photo||payCtx?.photo||'');const name=String(a.name||payCtx?.name||'Customer');$('#payContent').innerHTML=`<div class="pay-body"><div class="success-top">${photo?`<img class="success-photo customer-photo-zoom" src="${esc(photo)}" alt="Customer photo" data-photo="${esc(photo)}" data-name="${esc(name)}" data-phone="${esc(a.phone||payCtx?.phone||'')}" data-ack="${esc(a.ackNo||payCtx?.ackNo||'—')}" data-type="${esc(a.applicationType||payCtx?.applicationType||'PAN Service')}" title="Tap to view photo">`:`<div class="success-avatar">${esc(name.charAt(0).toUpperCase())}</div>`}<div class="check">✓</div><h1>Payment Request Sent</h1><p>${esc(msg)}</p></div><div class="receipt-mini"><div><span>Customer</span><b>${esc(name)}</b></div><div><span>Amount</span><b>${money(a.amount)}</b></div><div><span>Request ID</span><b>${esc(a.requestId||a.id)}</b></div><div><span>Application</span><b>${esc(a.applicationType||'PAN Service')}</b></div>${a.ackNo?`<div><span>ACK</span><b>${esc(a.ackNo)}</b></div>`:''}${a.utr?`<div><span>UTR</span><b>${esc(a.utr)}</b></div>`:''}<div><span>Date & Time</span><b>${date(a.createdAt)||'Just now'}</b></div></div><div class="customer-payment-live">Live payment status</div><div class="success-note"><b style="color:#15803d">Verification Pending</b><br>Your request has reached TECH SOURCE. Please wait while the payment is verified.</div><div class="payment-footer">TECH SOURCE • Thank you for choosing us</div></div>`;$('.customer-photo-zoom')?.addEventListener('click',e=>{e.stopPropagation();openCustomerPhoto(e.currentTarget)})}

// Payment page deliberately bypasses admin auth; dashboard/admin sections require verified admin.
if(payId){paymentPage()}else{auth.onAuthStateChanged(async u=>{if(!u){loginView();return}try{if(!(await isAdminUser(u))){await auth.signOut();loginView('Access denied: admin account required.')}else{admin=u;shell();await loadData();subscribe()}}catch(e){await auth.signOut();loginView('Could not verify admin access.')}})}
</script>
</body></html>
